<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balancer Element Visualization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 200px 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .column h2 {
            color: #667eea;
            font-size: 18px;
            text-align: center;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        input[type="number"] {
            flex: 1;
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover {
            background: #764ba2;
        }

        button.remove {
            background: #e74c3c;
            padding: 5px 10px;
            font-size: 12px;
        }

        button.remove:hover {
            background: #c0392b;
        }

        .list-box {
            border: 2px solid #ddd;
            border-radius: 5px;
            padding: 10px;
            min-height: 150px;
            background: #f9f9f9;
            overflow-y: auto;
            max-height: 300px;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 8px;
            margin-bottom: 5px;
            border-radius: 3px;
            border-left: 4px solid #667eea;
        }

        .middle-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .middle-element {
            background: #f39c12;
            color: white;
            padding: 15px 20px;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            min-width: 100px;
        }

        .sum-display {
            text-align: center;
            font-weight: bold;
            color: #333;
        }

        .sum-display.balanced {
            color: #27ae60;
        }

        .sum-display.unbalanced {
            color: #e74c3c;
        }

        /* Weighing Scale */
        .scale-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 20px;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #eee;
        }

        .scale-pan {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .pan {
            width: 120px;
            height: 40px;
            background: #34495e;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
            transition: transform 0.3s ease;
        }

        .left-pan {
            transform-origin: right center;
        }

        .right-pan {
            transform-origin: left center;
        }

        .scale-label {
            font-weight: bold;
            color: #333;
            text-align: center;
        }

        .beam {
            width: 300px;
            height: 8px;
            background: #2c3e50;
            position: relative;
            margin: 0 auto;
        }

        .fulcrum {
            width: 20px;
            height: 40px;
            background: #e74c3c;
            margin: 0 auto;
            border-radius: 2px;
            position: relative;
            top: -4px;
        }

        .result {
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            background: #ecf0f1;
        }

        .result.balanced {
            background: #d5f4e6;
            color: #27ae60;
        }

        .result.unbalanced {
            background: #fadbd8;
            color: #e74c3c;
        }

        .empty-message {
            color: #999;
            text-align: center;
            font-size: 14px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚖️ Balancer Element Visualization</h1>
        
        <div class="main-content">
            <!-- Left Column -->
            <div class="column">
                <h2>Left Side</h2>
                <div class="input-group">
                    <input type="number" id="leftInput" placeholder="Enter number">
                    <button onclick="addLeft()">Add</button>
                </div>
                <div class="list-box" id="leftList">
                    <div class="empty-message">No elements yet</div>
                </div>
            </div>

            <!-- Middle Column -->
            <div class="middle-section">
                <h2>Middle</h2>
                <div class="middle-element" id="middleValue">-</div>
                <div class="sum-display" id="middleSum">Sum: 0</div>
            </div>

            <!-- Right Column -->
            <div class="column">
                <h2>Right Side</h2>
                <div class="input-group">
                    <input type="number" id="rightInput" placeholder="Enter number">
                    <button onclick="addRight()">Add</button>
                </div>
                <div class="list-box" id="rightList">
                    <div class="empty-message">No elements yet</div>
                </div>
            </div>
        </div>

        <!-- Weighing Scale Visualization -->
        <div class="scale-container">
            <div class="scale-pan">
                <div class="scale-label" id="leftLabel">Left: 0</div>
                <div class="pan left-pan" id="leftPan"></div>
            </div>

            <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
                <div class="beam"></div>
                <div class="fulcrum"></div>
            </div>

            <div class="scale-pan">
                <div class="scale-label" id="rightLabel">Right: 0</div>
                <div class="pan right-pan" id="rightPan"></div>
            </div>
        </div>

        <div class="result" id="result">Enter values to check balance</div>
    </div>

    <script>
        let leftElements = [];
        let rightElements = [];
        let middleElement = null;

        function addLeft() {
            const input = document.getElementById('leftInput');
            const value = parseFloat(input.value);
            
            if (isNaN(value)) {
                alert('Please enter a valid number');
                return;
            }
            
            leftElements.push(value);
            input.value = '';
            updateDisplay();
        }

        function addRight() {
            const input = document.getElementById('rightInput');
            const value = parseFloat(input.value);
            
            if (isNaN(value)) {
                alert('Please enter a valid number');
                return;
            }
            
            rightElements.push(value);
            input.value = '';
            updateDisplay();
        }

        function removeLeft(index) {
            leftElements.splice(index, 1);
            updateDisplay();
        }

        function removeRight(index) {
            rightElements.splice(index, 1);
            updateDisplay();
        }

        function setMiddle() {
            const value = prompt('Enter middle element value:');
            if (value !== null && !isNaN(parseFloat(value))) {
                middleElement = parseFloat(value);
                updateDisplay();
            }
        }

        function updateDisplay() {
            // Update left list
            const leftList = document.getElementById('leftList');
            if (leftElements.length === 0) {
                leftList.innerHTML = '<div class="empty-message">No elements yet</div>';
            } else {
                leftList.innerHTML = leftElements.map((val, idx) => 
                    `<div class="list-item">
                        <span>${val}</span>
                        <button class="remove" onclick="removeLeft(${idx})">✕</button>
                    </div>`
                ).join('');
            }

            // Update right list
            const rightList = document.getElementById('rightList');
            if (rightElements.length === 0) {
                rightList.innerHTML = '<div class="empty-message">No elements yet</div>';
            } else {
                rightList.innerHTML = rightElements.map((val, idx) => 
                    `<div class="list-item">
                        <span>${val}</span>
                        <button class="remove" onclick="removeRight(${idx})">✕</button>
                    </div>`
                ).join('');
            }

            // Update middle element
            const middleValue = document.getElementById('middleValue');
            if (middleElement === null) {
                middleValue.textContent = 'Click to add';
                middleValue.style.cursor = 'pointer';
                middleValue.onclick = setMiddle;
            } else {
                middleValue.textContent = middleElement;
                middleValue.onclick = setMiddle;
            }

            // Calculate sums
            const leftSum = leftElements.reduce((a, b) => a + b, 0);
            const rightSum = rightElements.reduce((a, b) => a + b, 0);

            // Update sum displays
            document.getElementById('middleSum').textContent = `Middle: ${middleElement !== null ? middleElement : 0}`;
            document.getElementById('leftLabel').textContent = `Left: ${leftSum}`;
            document.getElementById('rightLabel').textContent = `Right: ${rightSum}`;

            // Update scale visualization
            const maxSum = Math.max(leftSum, rightSum, 1);
            const leftRotation = ((rightSum - leftSum) / maxSum) * 15;
            const rightRotation = -leftRotation;

            document.getElementById('leftPan').style.transform = `rotateZ(${leftRotation}deg)`;
            document.getElementById('rightPan').style.transform = `rotateZ(${rightRotation}deg)`;

            // Update result
            const result = document.getElementById('result');
            const middleSum = document.getElementById('middleSum');
            
            if (leftSum === rightSum && leftSum > 0) {
                result.className = 'result balanced';
                result.textContent = '✅ BALANCED! Left sum = Right sum';
                middleSum.className = 'sum-display balanced';
            } else if (leftSum !== rightSum) {
                result.className = 'result unbalanced';
                const diff = Math.abs(leftSum - rightSum);
                const heavier = leftSum > rightSum ? 'Left' : 'Right';
                result.textContent = `⚠️ UNBALANCED - ${heavier} side is heavier by ${diff}`;
                middleSum.className = 'sum-display unbalanced';
            } else {
                result.className = 'result';
                result.textContent = 'Enter values to check balance';
                middleSum.className = 'sum-display';
            }
        }

        // Initialize display
        updateDisplay();
    </script>
</body>
</html>
